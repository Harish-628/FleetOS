[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetos-backend"
version = "0.1.0"
description = "FleetOS Commercial Tourist Bus Fleet Backend & Offline Sync Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "slowapi>=0.1.9",
    "boto3>=1.34.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

