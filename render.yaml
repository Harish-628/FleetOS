services:
  - type: web
    name: fleetos-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && pip install ."
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
        # Connect to Neon PostgreSQL: postgresql://<user>:<password>@<neon-host>/<dbname>?sslmode=require
      - key: JWT_SECRET_KEY
        sync: false
      - key: DRIVER_QR_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_DRIVER_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
        # e.g. https://<project-ref>.storage.supabase.co/storage/v1/s3 or Cloudflare R2
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET_NAME
        value: vinoth-travels-receipts
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
        # e.g. https://fleetos.vercel.app
