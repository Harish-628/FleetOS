services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetos-postgres
    restart: always
    environment:
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: fleet_secure_password_2026
      POSTGRES_DB: fleetos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_admin -d fleetos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetos-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fleet_admin:fleet_secure_password_2026@postgres:5432/fleetos_db
      PROJECT_NAME: FleetOS
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fleetos-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
